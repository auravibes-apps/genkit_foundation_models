name: genkit_foundation_models
description: Genkit provider for Apple's on-device Foundation Models.
version: 0.0.5
homepage: https://github.com/auravibes-apps/genkit_foundation_models
repository: https://github.com/auravibes-apps/genkit_foundation_models

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  genkit: ">=0.14.1 <0.17.0"
  meta: ^1.17.0

dev_dependencies:
  dart_flutter_team_lints: ^3.0.0
  pigeon: ^27.1.0
  test: ^1.29.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: GenkitFoundationModelsPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: GenkitFoundationModelsPlugin
        sharedDarwinSource: true
