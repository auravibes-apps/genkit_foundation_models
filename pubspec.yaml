name: genkit_foundation_models
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  genkit: ^0.13.2
  http: ^1.6.0
  json_schema_builder: ^0.1.3
  meta: ^1.17.0
  openai_dart: ^5.0.0
  schemantic: ^0.1.3

dev_dependencies:
  build_runner: ^2.10.5
  build_test: ^3.5.5
  dart_flutter_team_lints: ^3.0.0
  mockito: ^5.4.4
  pigeon: ^26.3.4
  test: ^1.29.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: GenkitFoundationModelsPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: GenkitFoundationModelsPlugin
        sharedDarwinSource: true
